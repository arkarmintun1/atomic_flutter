name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Infos (e.g. the material.dart -> material_ui deprecation on newer
        # stable) shouldn't block tests; warnings and errors still fail.
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test
